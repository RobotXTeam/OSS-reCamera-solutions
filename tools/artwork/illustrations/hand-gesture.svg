    <polyline points="570,324 540,238 535,201 530,176 530,154"/>
    <polyline points="540,238 570,232 570,193 570,168 570,146"/>
    <polyline points="570,232 600,238 605,201 607,176 610,157"/>
    <polyline points="600,238 630,252 640,218 645,196 650,179"/>
