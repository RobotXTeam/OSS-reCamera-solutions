    <circle cx="545" cy="285" r="4"/><circle cx="530" cy="252" r="4"/><circle cx="520" cy="224" r="4"/><circle cx="510" cy="201" r="4"/>
    <circle cx="540" cy="238" r="4"/><circle cx="535" cy="201" r="4"/><circle cx="530" cy="176" r="4"/><circle cx="530" cy="154" r="4"/>
    <circle cx="570" cy="232" r="4"/><circle cx="570" cy="193" r="4"/><circle cx="570" cy="168" r="4"/><circle cx="570" cy="146" r="4"/>
    <circle cx="600" cy="238" r="4"/><circle cx="605" cy="201" r="4"/><circle cx="607" cy="176" r="4"/><circle cx="610" cy="157" r="4"/>
    <circle cx="630" cy="252" r="4"/><circle cx="640" cy="218" r="4"/><circle cx="645" cy="196" r="4"/><circle cx="650" cy="179" r="4"/>
