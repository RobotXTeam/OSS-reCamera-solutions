<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FB0C2"/>
      <stop offset="1" stop-color="#76889C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect x="40" y="40" width="1200" height="640" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>

  <!-- ceiling camera + vision cone -->
  <line x1="640" y1="66" x2="640" y2="102" stroke="#3E4C5E" stroke-width="8"/>
  <rect x="596" y="102" width="88" height="46" rx="12" fill="#3E4C5E"/>
  <circle cx="640" cy="125" r="11" fill="#9FB0C2"/>
  <circle cx="640" cy="125" r="5" fill="#1F2937"/>
  <polygon points="640,150 300,332 980,332" fill="#FFFFFF" opacity="0.16"/>

  <!-- callouts -->
  <polyline points="596,116 470,96 420,96" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="420" cy="96" r="3.5" fill="#FFFFFF"/>
  <text x="300" y="102" font-family="DejaVu Sans" font-size="20" fill="#FFFFFF" opacity="0.9">CAM CH0</text>

  <!-- conveyor -->
  <rect x="180" y="470" width="920" height="36" rx="10" fill="#3E4C5E"/>
  <rect x="240" y="506" width="16" height="110" fill="#334155"/>
  <rect x="1020" y="506" width="16" height="110" fill="#334155"/>
  <circle cx="210" cy="488" r="10" fill="#55657A"/>
  <circle cx="640" cy="488" r="10" fill="#55657A"/>
  <circle cx="1070" cy="488" r="10" fill="#55657A"/>

  <!-- workpiece with grooves -->
  <rect x="260" y="330" width="760" height="140" rx="8" fill="#C8D0D8" stroke="#5A6470" stroke-width="2"/>
  <g stroke="#B8C0C9" stroke-width="1.5">
    <line x1="272" y1="356" x2="1008" y2="356"/>
    <line x1="272" y1="386" x2="1008" y2="386"/>
    <line x1="272" y1="416" x2="1008" y2="416"/>
    <line x1="272" y1="446" x2="1008" y2="446"/>
  </g>
  <g fill="#2A3138">
    <rect x="320" y="345" width="36" height="110"/>
    <rect x="470" y="345" width="36" height="110"/>
    <rect x="620" y="345" width="36" height="110"/>
    <rect x="770" y="345" width="36" height="110"/>
    <rect x="920" y="345" width="36" height="110"/>
  </g>

  <!-- ROI + detection boxes -->
  <rect x="250" y="318" width="780" height="164" fill="none" stroke="#F5C33B" stroke-width="2.5" stroke-dasharray="12 9"/>
  <g fill="none" stroke="#B8E356" stroke-width="3">
    <rect x="308" y="333" width="60" height="134"/>
    <rect x="458" y="333" width="60" height="134"/>
    <rect x="608" y="333" width="60" height="134"/>
    <rect x="758" y="333" width="60" height="134"/>
    <rect x="908" y="333" width="60" height="134"/>
  </g>

  <!-- label chips -->
  <g font-family="DejaVu Sans" font-weight="bold">
    <rect x="308" y="282" width="118" height="34" rx="8" fill="#D3F28A"/>
    <text x="326" y="306" font-size="19" fill="#3E4C5E">GROOVE</text>
    <rect x="880" y="252" width="150" height="40" rx="9" fill="#D3F28A"/>
    <text x="898" y="280" font-size="22" fill="#3E4C5E">count = 5</text>
  </g>

  <!-- caption -->
  <g font-family="DejaVu Sans" font-weight="bold" fill="#FFFFFF" opacity="0.55" text-anchor="end" letter-spacing="2">
    <text x="1180" y="600" font-size="34">GROOVE / BAR COUNTING</text>
    <text x="1180" y="640" font-size="26">PURE OPENCV - NO MODEL</text>
  </g>
</svg>
